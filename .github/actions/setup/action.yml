name: Pinned Node and pnpm
description: Install the locked build toolchain without dependency lifecycle scripts.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: 10.33.2
        run_install: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "26"
        cache: pnpm
    - run: pnpm install --frozen-lockfile --ignore-scripts
      shell: bash
