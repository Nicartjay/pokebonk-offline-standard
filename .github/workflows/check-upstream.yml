name: Detect online game updates (report only)
on:
  schedule:
    - cron: "41 1 * * *" # Daily at 09:41 Asia/Manila.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-version-issue
  cancel-in-progress: false
jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/setup
      - name: Detect the upstream build and reconcile the update-tracking issue
        run: node standard/scripts/check-upstream.mjs --report
        env: {GH_TOKEN: "${{ github.token }}"}
      # No capture, promotion, signing, release creation, or publication.
