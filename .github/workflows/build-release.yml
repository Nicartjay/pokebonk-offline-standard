name: Build all installers
on:
  push:
    tags: ["standard-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing standard-vX.Y.Z tag; leave blank for main-branch test candidates"
        required: false
        type: string
        default: ""
      desktop_only:
        description: "Desktop-only smoke test (no Android candidate or complete candidate audit)"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: installers-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  shared:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Validate reviewed source and version
        id: identity
        run: node standard/scripts/ci-release.mjs
        env:
          REQUESTED_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      - run: pnpm prepare:game
      - run: pnpm test
      - run: pnpm verify
      - name: Archive the single shared game payload
        run: tar -cf "$RUNNER_TEMP/standard-game.tar" -C build standard-game
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-game-payload
          path: ${{ runner.temp }}/standard-game.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  desktop:
    needs: shared
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, platform: darwin, arch: arm64}
          - {os: macos-15, platform: darwin, arch: x64}
          - {os: windows-2025, platform: win32, arch: x64}
          - {os: ubuntu-24.04, platform: linux, arch: x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.shared.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: shared-game-payload, path: "${{ runner.temp }}"}
      - run: node standard/scripts/restore-payload.mjs
        env: {GAME_ARCHIVE: "${{ runner.temp }}/standard-game.tar"}
      - run: node standard/scripts/package-desktop.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: standard/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  android:
    if: github.event_name == 'push' || !inputs.desktop_only
    needs: shared
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.shared.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: {distribution: temurin, java-version: "21"}
      - run: node standard/scripts/setup-android-sdk.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: shared-game-payload, path: "${{ runner.temp }}"}
      - run: node standard/scripts/restore-payload.mjs
        env: {GAME_ARCHIVE: "${{ runner.temp }}/standard-game.tar"}
      - name: Test, lint and build a clearly unsigned APK without any private keys
        run: node standard/scripts/build-android.mjs --unsigned-candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-android-universal
          path: standard/candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  verify-candidates:
    needs: [shared, desktop, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.shared.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: shared-game-payload, path: "${{ runner.temp }}"}
      - run: node standard/scripts/restore-payload.mjs
        env: {GAME_ARCHIVE: "${{ runner.temp }}/standard-game.tar"}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          merge-multiple: true
          path: standard/release/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-android-universal
          path: standard/candidate/
      - name: Verify all candidates and embedded Android assets; local signing remains required
        run: node standard/scripts/verify-candidates.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-audit-${{ needs.shared.outputs.version }}
          path: standard/candidate/candidate-summary.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  # No private-key secrets, signing environment, draft creation or public
  # publication here. Run release:finalize locally with the original keys.
